<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Pulse Checker</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111827;
        color: #e8ecf3;
        font-family: 'Segoe UI', system-ui, sans-serif;
        cursor: pointer;
        user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      #label {
        font-size: 13px;
        color: #a8b3c8;
      }

      #seconds {
        font-size: 30px;
        font-weight: 600;
        color: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="label">まもなく確認</div>
      <div id="seconds">--</div>
    </div>
    <script type="module" src="/src/countdown.ts"></script>
  </body>
</html>
